name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke tools/list
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          messages = [
              {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}},
              {"jsonrpc":"2.0","method":"notifications/initialized"},
              {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}},
          ]
          payload = "".join(json.dumps(m) + "\n" for m in messages)
          proc = subprocess.Popen(
              ["node", "dist/cli.js", "--client", "cursor"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          try:
              out, err = proc.communicate(payload, timeout=15)
          except subprocess.TimeoutExpired:
              proc.kill()
              out, err = proc.communicate()
              print(err or "timed out", file=sys.stderr)
              raise

          replies = []
          for line in out.splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  replies.append(json.loads(line))
              except json.JSONDecodeError:
                  print("non-json stdout:", line, file=sys.stderr)
          listed = next((m for m in replies if m.get("id") == 2), None)
          if listed is None:
              print("stderr:", err, file=sys.stderr)
              print("stdout:", out, file=sys.stderr)
              raise SystemExit("no tools/list response")
          names = [t["name"] for t in listed["result"]["tools"]]
          for name in (
              "yaaif_configure_check",
              "yaaif_ops_analyze",
              "yaaif_ops_telemetry",
              "yaaif_doctor",
              "yaaif_api_key_create",
              "yaaif_api_key_bind_deployment",
              "yaaif_mcp_deployment_redeploy",
              "yaaif_mcp_deployment_k8s_status",
              "yaaif_deployment_settings_status",
              "yaaif_files_list",
              "yaaif_load_artifacts",
              "yaaif_generate_file",
              "yaaif_file_artifact_versions",
              "yaaif_file_get_extracted",
          ):
              assert name in names, name
          assert len(names) >= 40, len(names)
          print("ok", len(names))
          PY
